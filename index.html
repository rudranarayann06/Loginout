<!DOCTYPE html>
<html>
<head>
    <title>Hello World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">

        <h2>Login / Logout</h2>

        <!-- LOGIN SECTION -->
        <div id="loginSection">

            <div class="role-buttons">
                <button id="userRoleBtn" class="active">
                    Login as User
                </button>

                <button id="adminRoleBtn">
                    Login as Admin
                </button>
            </div>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="main-btn">
                    Login
                </button>

            </form>

            <button id="googleLogin" class="google-btn">
                🔵 Continue with Google
            </button>

            <p class="signup-text">
                New user?
                <button id="showSignup">
                    Sign Up
                </button>
            </p>

        </div>


        <!-- SIGNUP SECTION -->
        <div id="signupSection" class="hidden">

            <h3>Create Account</h3>

            <form id="signupForm">

                <input
                    type="text"
                    id="signupName"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="tel"
                    id="signupPhone"
                    placeholder="Phone Number"
                    required
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    minlength="6"
                    required
                >

                <input
                    type="password"
                    id="signupConfirmPassword"
                    placeholder="Confirm Password"
                    minlength="6"
                    required
                >

                <select id="signupRole">

                    <option value="user">
                        User
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

                <button type="submit" class="main-btn">
                    Create Account
                </button>

            </form>

            <p class="signup-text">
                Already have an account?
                <button id="showLogin">
                    Login
                </button>
            </p>

        </div>


        <!-- LOGGED IN SECTION -->
        <div id="userSection" class="hidden">

            <div class="profile">

                <div class="profile-circle" id="profileInitial">
                    U
                </div>

                <h3 id="displayName">
                    User
                </h3>

                <p id="displayEmail">
                    email@example.com
                </p>

                <span id="displayRole" class="role">
                    User
                </span>

            </div>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>

        </div>


        <p id="message"></p>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="content">

        <h1>Hello World</h1>

        <p>
            Welcome to my website.
        </p>

        <div id="welcomeMessage"></div>

    </main>


    <!-- Firebase -->
    <script type="module" src="script.js"></script>

</body>
</html>

    <script src="script.js"></script>
</body>
</html>
